<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чат</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f1f5f9; display: flex; flex-direction: column;
    }
    header {
      background: #6366f1; color: #fff; padding: 14px 18px;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    header h1 { font-size: 17px; margin: 0; }
    header a { color: #e0e7ff; font-size: 14px; text-decoration: none; }
    #messages {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .msg { max-width: 75%; padding: 8px 12px; border-radius: 14px; line-height: 1.35; }
    .msg .who { font-size: 12px; font-weight: 600; margin-bottom: 2px; opacity: .8; }
    .msg .txt { white-space: pre-wrap; word-wrap: break-word; }
    .msg .time { font-size: 10px; opacity: .6; margin-top: 3px; text-align: right; }
    .mine { align-self: flex-end; background: #6366f1; color: #fff; }
    .theirs { align-self: flex-start; background: #fff; color: #1e293b; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
    .mine .who { display: none; }
    form {
      display: flex; gap: 8px; padding: 12px; background: #fff;
      border-top: 1px solid #e2e8f0; flex-shrink: 0;
    }
    #text {
      flex: 1; padding: 11px 14px; border: 1px solid #cbd5e1;
      border-radius: 22px; font-size: 15px; outline: none;
    }
    #text:focus { border-color: #6366f1; }
    button {
      border: none; background: #6366f1; color: #fff; border-radius: 50%;
      width: 44px; height: 44px; font-size: 18px; cursor: pointer; flex-shrink: 0;
    }
    button:hover { background: #4f46e5; }
  </style>
</head>
<body>
  <header>
    <h1>💬 Общий чат</h1>
    <span>{{ user }} · <a href="/logout">выйти</a></span>
  </header>

  <div id="messages"></div>

  <form id="form">
    <input id="text" placeholder="Напишите сообщение…" autocomplete="off" autofocus>
    <button type="submit">➤</button>
  </form>

  <script>
    const me = {{ user|tojson }};
    const box = document.getElementById("messages");
    const form = document.getElementById("form");
    const input = document.getElementById("text");
    let lastId = 0;

    function fmtTime(iso) {
      const d = new Date(iso);
      return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function addMessage(m) {
      const el = document.createElement("div");
      el.className = "msg " + (m.username === me ? "mine" : "theirs");
      el.innerHTML = `
        <div class="who"></div>
        <div class="txt"></div>
        <div class="time">${fmtTime(m.created)}</div>`;
      el.querySelector(".who").textContent = m.username;
      el.querySelector(".txt").textContent = m.text;
      box.appendChild(el);
      lastId = Math.max(lastId, m.id);
    }

    async function poll() {
      try {
        const res = await fetch("/api/messages?after=" + lastId);
        if (res.status === 401) { location.href = "/login"; return; }
        const data = await res.json();
        const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 100;
        data.forEach(addMessage);
        if (data.length && nearBottom) box.scrollTop = box.scrollHeight;
      } catch (e) { /* нет сети — попробуем позже */ }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      await fetch("/api/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
      });
      poll();
    });

    poll();
    setInterval(poll, 2000);  // обновление каждые 2 секунды
  </script>
</body>
</html>
