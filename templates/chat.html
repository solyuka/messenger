<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чат</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f1f5f9; display: flex; flex-direction: column;
    }
    header {
      background: #6366f1; color: #fff; padding: 10px 16px;
      display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    }
    header .ava {
      width: 38px; height: 38px; border-radius: 50%; object-fit: cover;
      background: #c7d2fe; cursor: pointer; border: 2px solid #fff;
    }
    header .title { flex: 1; }
    header h1 { font-size: 16px; margin: 0; }
    header .me { font-size: 12px; opacity: .85; }
    header a { color: #e0e7ff; font-size: 13px; text-decoration: none; }

    #messages {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .row { display: flex; gap: 8px; align-items: flex-end; max-width: 80%; }
    .row.mine { align-self: flex-end; flex-direction: row-reverse; }
    .row .ava {
      width: 30px; height: 30px; border-radius: 50%; object-fit: cover;
      background: #c7d2fe; flex-shrink: 0;
    }
    .bubble { padding: 8px 12px; border-radius: 14px; line-height: 1.35; }
    .bubble .who { font-size: 12px; font-weight: 600; margin-bottom: 2px; opacity: .8; }
    .bubble .txt { white-space: pre-wrap; word-wrap: break-word; }
    .bubble .time { font-size: 10px; opacity: .6; margin-top: 3px; text-align: right; }
    .mine .bubble { background: #6366f1; color: #fff; }
    .mine .bubble .who { display: none; }
    .theirs .bubble { background: #fff; color: #1e293b; box-shadow: 0 1px 2px rgba(0,0,0,.1); }

    .file {
      display: flex; align-items: center; gap: 10px;
      padding: 8px; border-radius: 10px; margin-top: 2px;
      background: rgba(0,0,0,.06); cursor: pointer;
    }
    .mine .file { background: rgba(255,255,255,.18); }
    .file .icon { font-size: 22px; }
    .file .info { flex: 1; min-width: 0; }
    .file .name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file .size { font-size: 11px; opacity: .7; }
    .file .status { font-size: 11px; opacity: .8; }

    form {
      display: flex; gap: 8px; padding: 10px; background: #fff;
      border-top: 1px solid #e2e8f0; flex-shrink: 0; align-items: center;
    }
    #text {
      flex: 1; padding: 11px 14px; border: 1px solid #cbd5e1;
      border-radius: 22px; font-size: 15px; outline: none;
    }
    #text:focus { border-color: #6366f1; }
    .iconbtn {
      border: none; background: #eef2ff; color: #6366f1; border-radius: 50%;
      width: 42px; height: 42px; font-size: 20px; cursor: pointer; flex-shrink: 0;
    }
    .sendbtn { background: #6366f1; color: #fff; }
    .iconbtn:hover { filter: brightness(.95); }
    .hint {
      font-size: 11px; color: #94a3b8; text-align: center; padding: 4px;
      background: #f8fafc;
    }
  </style>
</head>
<body>
  <header>
    <img id="myAvatar" class="ava" title="Сменить фото">
    <div class="title">
      <h1>💬 Общий чат</h1>
      <div class="me">{{ user }} · <a href="/logout">выйти</a></div>
    </div>
  </header>

  <div id="messages"></div>
  <div class="hint">Файлы идут напрямую между устройствами. Чтобы файл скачался, вкладка отправителя должна быть открыта.</div>

  <form id="form">
    <button type="button" class="iconbtn" id="fileBtn" title="Прикрепить файл">📎</button>
    <input id="text" placeholder="Напишите сообщение…" autocomplete="off">
    <button type="submit" class="iconbtn sendbtn">➤</button>
  </form>

  <input type="file" id="fileInput" style="display:none">
  <input type="file" id="avatarInput" accept="image/*" style="display:none">

  <script>
  const me = {{ user|tojson }};
  const box = document.getElementById("messages");
  const form = document.getElementById("form");
  const input = document.getElementById("text");
  let lastId = 0;
  let avatars = {};                 // username -> dataURL
  const myFiles = {};               // fileId -> File (файлы, которые Я отправил, лежат у меня)
  // STUN помогает узнать свой адрес, TURN — ретранслирует, когда прямое
  // соединение невозможно (строгий NAT, мобильный интернет и т.п.).
  const STUN = { iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.l.google.com:19302" },
    // бесплатные публичные TURN-серверы Open Relay (metered.ca)
    { urls: "turn:openrelay.metered.ca:80", username: "openrelayproject", credential: "openrelayproject" },
    { urls: "turn:openrelay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" },
    { urls: "turn:openrelay.metered.ca:443?transport=tcp", username: "openrelayproject", credential: "openrelayproject" }
  ]};

  const defaultAva =
    "data:image/svg+xml," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60">' +
      '<rect width="60" height="60" fill="#c7d2fe"/>' +
      '<circle cx="30" cy="23" r="11" fill="#6366f1"/>' +
      '<rect x="12" y="38" width="36" height="22" rx="11" fill="#6366f1"/></svg>');

  function avaFor(u){ return avatars[u] || defaultAva; }
  function fmtTime(iso){ const d=new Date(iso); return d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}); }
  function fmtSize(b){ if(b<1024)return b+" Б"; if(b<1048576)return (b/1024).toFixed(1)+" КБ"; return (b/1048576).toFixed(1)+" МБ"; }

  // --------------------------------------------------------------- аватарки
  document.getElementById("myAvatar").onclick = () => document.getElementById("avatarInput").click();
  document.getElementById("avatarInput").onchange = (e) => {
    const f = e.target.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      // уменьшаем картинку до 200px и сжимаем
      const img = new Image();
      img.onload = async () => {
        const c = document.createElement("canvas");
        const size = 200;
        c.width = size; c.height = size;
        const ctx = c.getContext("2d");
        const s = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, size, size);
        const dataUrl = c.toDataURL("image/jpeg", 0.8);
        await fetch("/api/avatar", {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({ avatar: dataUrl })
        });
        avatars[me] = dataUrl;
        document.getElementById("myAvatar").src = dataUrl;
        rerenderAvatars();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(f);
  };

  async function loadAvatars(){
    try{
      const r = await fetch("/api/avatars");
      if(r.ok){ avatars = await r.json(); document.getElementById("myAvatar").src = avaFor(me); rerenderAvatars(); }
    }catch(e){}
  }
  function rerenderAvatars(){
    document.querySelectorAll("[data-ava-user]").forEach(el=>{
      el.src = avaFor(el.getAttribute("data-ava-user"));
    });
  }

  // --------------------------------------------------------------- сообщения
  function addMessage(m){
    const mine = m.username === me;
    const row = document.createElement("div");
    row.className = "row " + (mine ? "mine" : "theirs");

    const ava = document.createElement("img");
    ava.className = "ava"; ava.setAttribute("data-ava-user", m.username);
    ava.src = avaFor(m.username);

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    if(m.kind === "file"){
      let meta; try{ meta = JSON.parse(m.text); }catch(e){ meta = null; }
      bubble.innerHTML = `<div class="who"></div>`;
      bubble.querySelector(".who").textContent = m.username;
      const fileEl = document.createElement("div");
      fileEl.className = "file";
      fileEl.innerHTML = `
        <div class="icon">📄</div>
        <div class="info">
          <div class="name"></div>
          <div class="size"></div>
          <div class="status">Нажмите, чтобы скачать</div>
        </div>`;
      fileEl.querySelector(".name").textContent = meta ? meta.name : "файл";
      fileEl.querySelector(".size").textContent = meta ? fmtSize(meta.size) : "";
      fileEl.onclick = () => downloadFile(meta, m.username, fileEl);
      bubble.appendChild(fileEl);
    } else {
      bubble.innerHTML = `<div class="who"></div><div class="txt"></div><div class="time">${fmtTime(m.created)}</div>`;
      bubble.querySelector(".who").textContent = m.username;
      bubble.querySelector(".txt").textContent = m.text;
    }

    row.appendChild(ava); row.appendChild(bubble);
    box.appendChild(row);
    lastId = Math.max(lastId, m.id);
  }

  async function pollMessages(){
    try{
      const res = await fetch("/api/messages?after=" + lastId);
      if(res.status === 401){ location.href="/login"; return; }
      const data = await res.json();
      const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
      data.forEach(addMessage);
      if(data.length && nearBottom) box.scrollTop = box.scrollHeight;
    }catch(e){}
  }

  form.addEventListener("submit", async (e)=>{
    e.preventDefault();
    const text = input.value.trim(); if(!text) return;
    input.value = "";
    await fetch("/api/send",{method:"POST",headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ text })});
    pollMessages();
  });

  // --------------------------------------------------------------- выбор файла
  document.getElementById("fileBtn").onclick = ()=> document.getElementById("fileInput").click();
  document.getElementById("fileInput").onchange = async (e)=>{
    const f = e.target.files[0]; if(!f) return;
    e.target.value = "";
    const fileId = me + "-" + Date.now() + "-" + Math.random().toString(36).slice(2,7);
    myFiles[fileId] = f;   // держим файл у себя в памяти (на сервер НЕ грузим)
    const meta = { fileId, name: f.name, size: f.size, owner: me };
    await fetch("/api/send",{method:"POST",headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ text: JSON.stringify(meta), kind: "file" })});
    pollMessages();
  };

  // =============================================================== WebRTC P2P
  // Активные соединения: ключ = "peer|fileId"
  const conns = {};

  function sendSignal(to, payload){
    return fetch("/api/signal",{method:"POST",headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ to, data: JSON.stringify(payload) })});
  }

  // ---- Получатель: кликнул "скачать" ----
  async function downloadFile(meta, owner, fileEl){
    if(!meta){ return; }
    if(owner === me){  // мой собственный файл — сохраняем напрямую
      const f = myFiles[meta.fileId];
      if(f){ triggerSave(f, meta.name); }
      else { fileEl.querySelector(".status").textContent = "Файл больше недоступен (перезагрузите страницу-отправитель)"; }
      return;
    }
    const statusEl = fileEl.querySelector(".status");
    statusEl.textContent = "Запрос отправлен…";
    const key = owner + "|" + meta.fileId;

    // если был старый объект соединения — закроем
    if(conns[key]){ try{ conns[key].pc.close(); }catch(e){} delete conns[key]; }

    const pc = new RTCPeerConnection(STUN);
    const ch = pc.createDataChannel("file");
    const chunks = []; let received = 0;
    let answered = false;     // отправитель ответил (значит — он в сети)
    let opened = false;       // канал открылся (соединение установлено)
    conns[key] = { pc, role: "receiver", markAnswered(){ answered = true; } };

    pc.onicecandidate = (ev)=>{ if(ev.candidate) sendSignal(owner, {t:"ice", fileId:meta.fileId, candidate:ev.candidate}); };

    pc.oniceconnectionstatechange = ()=>{
      const st = pc.iceConnectionState;
      if(st === "checking" && answered) statusEl.textContent = "Устанавливаю соединение…";
      if(st === "failed"){
        statusEl.textContent = "Не удалось соединиться (сеть блокирует). Попробуйте ещё раз";
      }
    };

    ch.binaryType = "arraybuffer";
    ch.onmessage = (ev)=>{
      if(typeof ev.data === "string" && ev.data === "__END__"){
        const blob = new Blob(chunks);
        triggerSave(blob, meta.name);
        statusEl.textContent = "Скачано ✓";
        ch.close(); pc.close(); delete conns[key];
        return;
      }
      chunks.push(ev.data); received += ev.data.byteLength;
      statusEl.textContent = "Загрузка… " + Math.round(received/meta.size*100) + "%";
    };
    ch.onopen = ()=>{ opened = true; statusEl.textContent = "Передача…"; };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    sendSignal(owner, { t:"offer", fileId: meta.fileId, sdp: pc.localDescription });

    // Этап 1: ждём ответ отправителя (он онлайн?) — 12 сек
    setTimeout(()=>{
      if(!conns[key]) return;
      if(!answered){
        statusEl.textContent = "Отправитель не в сети (его вкладка закрыта)";
        pc.close(); delete conns[key];
      }
    }, 12000);

    // Этап 2: ответ есть, но соединение не установилось — 30 сек
    setTimeout(()=>{
      if(!conns[key]) return;
      if(answered && !opened){
        statusEl.textContent = "Сеть не пропускает соединение. Попробуйте Wi-Fi/VPN";
        pc.close(); delete conns[key];
      }
    }, 30000);
  }

  // ---- Отправитель: получил запрос на свой файл ----
  async function handleOffer(sender, payload){
    const f = myFiles[payload.fileId];
    if(!f) return; // файла нет (перезагрузили страницу) — игнор
    const key = sender + "|" + payload.fileId;
    const pc = new RTCPeerConnection(STUN);
    conns[key] = { pc, role: "sender" };

    pc.onicecandidate = (ev)=>{ if(ev.candidate) sendSignal(sender, {t:"ice", fileId:payload.fileId, candidate:ev.candidate}); };
    pc.ondatachannel = (ev)=>{
      const ch = ev.channel; ch.binaryType = "arraybuffer";
      ch.onopen = ()=> streamFile(ch, f, ()=>{ pc.close(); delete conns[key]; });
    };
    await pc.setRemoteDescription(payload.sdp);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    sendSignal(sender, { t:"answer", fileId: payload.fileId, sdp: pc.localDescription });
  }

  function streamFile(ch, file, done){
    const CHUNK = 16 * 1024;
    let offset = 0;
    const reader = new FileReader();
    reader.onload = (e)=>{
      ch.send(e.target.result);
      offset += e.target.result.byteLength;
      if(offset < file.size){
        // контроль переполнения буфера
        if(ch.bufferedAmount > 1_000_000){ setTimeout(readNext, 50); } else { readNext(); }
      } else {
        ch.send("__END__");
        if(done) setTimeout(done, 1000);
      }
    };
    function readNext(){ reader.readAsArrayBuffer(file.slice(offset, offset + CHUNK)); }
    readNext();
  }

  function triggerSave(blob, name){
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name || "file";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 10000);
  }

  // ---- обработка входящих сигналов ----
  async function pollSignals(){
    try{
      const r = await fetch("/api/signals");
      if(!r.ok) return;
      const list = await r.json();
      for(const s of list){
        let p; try{ p = JSON.parse(s.data); }catch(e){ continue; }
        const key = s.sender + "|" + p.fileId;
        if(p.t === "offer"){ await handleOffer(s.sender, p); }
        else if(p.t === "answer"){ const c = conns[key]; if(c){ if(c.markAnswered) c.markAnswered(); await c.pc.setRemoteDescription(p.sdp); } }
        else if(p.t === "ice"){ const c = conns[key]; if(c){ try{ await c.pc.addIceCandidate(p.candidate); }catch(e){} } }
      }
    }catch(e){}
  }

  // --------------------------------------------------------------- старт
  loadAvatars();
  pollMessages();
  setInterval(pollMessages, 2000);
  setInterval(loadAvatars, 15000);
  setInterval(pollSignals, 1200);
  </script>
</body>
</html>
