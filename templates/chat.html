<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чат</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    /* ===== Темы (повышенный контраст) ===== */
    :root {
      --bg: #e7ebf3;
      --header: #4f46e5;
      --header-text: #ffffff;
      --panel: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --muted: #475569;
      --bubble-their: #ffffff;
      --bubble-their-text: #0f172a;
      --bubble-mine: #4f46e5;
      --bubble-mine-text: #ffffff;
      --input-bg: #ffffff;
      --input-border: #94a3b8;
      --icon-bg: #e0e7ff;
      --accent: #4f46e5;
      --hint-bg: #eef1f7;
      --avatar-bg: #c7d2fe;
      --shadow: 0 1px 3px rgba(0,0,0,.18);
      --chip-bg: #eef2ff;
    }
    body.dark {
      --bg: #0b1120;
      --header: #1e293b;
      --header-text: #f1f5f9;
      --panel: #1a2435;
      --border: #3b4a63;
      --text: #f1f5f9;
      --muted: #b3c0d4;
      --bubble-their: #29374f;
      --bubble-their-text: #f1f5f9;
      --bubble-mine: #6366f1;
      --bubble-mine-text: #ffffff;
      --input-bg: #0b1120;
      --input-border: #4b5b75;
      --icon-bg: #29374f;
      --accent: #a5b4fc;
      --hint-bg: #16202f;
      --avatar-bg: #475569;
      --shadow: 0 1px 4px rgba(0,0,0,.5);
      --chip-bg: #29374f;
    }

    body {
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg); display: flex; flex-direction: column;
      color: var(--text); transition: background .25s, color .25s;
      -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    img { -webkit-user-drag: none; user-drag: none; }
    .bubble .txt, .imgcap, .file .name, .reply-quote .rq-text {
      -webkit-user-select: text; -moz-user-select: text; user-select: text; cursor: text;
    }

    header {
      background: var(--header); color: var(--header-text); padding: 10px 16px;
      display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    }
    .avawrap { position: relative; flex-shrink: 0; }
    .avawrap .dot {
      position: absolute; bottom: 0; right: 0;
      width: 14px; height: 14px; border-radius: 50%;
      background: #ef4444; border: 2px solid var(--panel);
    }
    .avawrap .dot.online { background: #16a34a; }
    header .avawrap .ava {
      width: 64px; height: 64px; border-radius: 50%; object-fit: cover;
      background: var(--avatar-bg); cursor: pointer; border: 2px solid rgba(255,255,255,.85);
    }
    header .avawrap .dot { width: 16px; height: 16px; border-color: var(--header); }
    header .title { flex: 1; min-width: 0; }
    header h1 { font-size: 16px; margin: 0; }
    header .me { font-size: 12px; opacity: .9; }
    header a { color: inherit; font-size: 13px; text-decoration: underline; }
    .headbtn {
      border: none; background: rgba(255,255,255,.2); color: var(--header-text);
      width: 40px; height: 40px; border-radius: 50%; font-size: 18px; cursor: pointer; flex-shrink: 0;
    }
    .headbtn:hover { background: rgba(255,255,255,.34); }

    #members {
      display: flex; gap: 16px; padding: 10px 16px; background: var(--panel);
      border-bottom: 1px solid var(--border); overflow-x: auto; flex-shrink: 0;
    }
    #members.collapsed { display: none; }
    .memToggle {
      border: none; background: rgba(255,255,255,.2); color: var(--header-text);
      font-size: 12px; padding: 3px 9px; border-radius: 12px; cursor: pointer;
      margin-left: 8px; vertical-align: middle;
    }
    .memToggle:hover { background: rgba(255,255,255,.34); }
    #memArrow { display: inline-block; transition: transform .2s; }
    .memToggle.open #memArrow { transform: rotate(90deg); }
    #members .member { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 56px; }
    #members .avawrap .ava { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; background: var(--avatar-bg); }
    #members .avawrap .dot { border-color: var(--panel); }
    #members .mname { font-size: 11px; color: var(--text); max-width: 60px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #members .mstat { font-size: 10px; font-weight: 600; }
    #members .mstat.on { color: #16a34a; }
    #members .mstat.off { color: #ef4444; }

    #chatArea { flex: 1; position: relative; overflow: hidden; display: flex; }
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }

    .datesep {
      align-self: center; font-size: 11px; color: var(--muted); font-weight: 600;
      background: var(--hint-bg); padding: 3px 12px; border-radius: 12px; margin: 6px 0;
    }

    .imgprev { display: block; margin-top: 4px; max-width: 240px; max-height: 240px; border-radius: 10px; cursor: pointer; object-fit: cover; }
    .imgcap { font-size: 11px; opacity: .8; margin-top: 2px; }

    #lightbox {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.9);
      z-index: 100; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
    }
    #lightbox img { max-width: 92%; max-height: 80%; border-radius: 8px; }
    #lightbox a { color: #fff; background: var(--accent); padding: 10px 20px; border-radius: 10px; text-decoration: none; font-size: 15px; }
    #lightbox .close { position: absolute; top: 16px; right: 20px; color: #fff; font-size: 32px; cursor: pointer; }

    .row { display: flex; gap: 8px; align-items: flex-end; max-width: 82%; position: relative; }
    .row.mine { align-self: flex-end; flex-direction: row-reverse; }
    .row .avawrap .ava { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; background: var(--avatar-bg); }
    .row .avawrap .dot { border-color: var(--bg); }
    .bubble { padding: 8px 12px; border-radius: 14px; line-height: 1.4; position: relative; }
    .bubble .who { font-size: 12px; font-weight: 700; margin-bottom: 2px; opacity: .9; }
    .bubble .txt { white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; }
    .bubble .txt a { color: inherit; text-decoration: underline; }
    .bubble .time { font-size: 10px; opacity: .7; margin-top: 3px; text-align: right; }
    .bubble .reads { font-size: 10px; opacity: .9; margin-top: 2px; text-align: right; }
    .mine .bubble { background: var(--bubble-mine); color: var(--bubble-mine-text); }
    .mine .bubble .who { display: none; }
    .theirs .bubble { background: var(--bubble-their); color: var(--bubble-their-text); box-shadow: var(--shadow); border: 1px solid var(--border); }
    .theirs .bubble .reads { display: none; }

    /* цитата ответа внутри сообщения */
    .reply-quote {
      border-left: 3px solid var(--accent); padding: 3px 8px; margin-bottom: 5px;
      background: rgba(127,127,127,.14); border-radius: 6px; cursor: pointer; font-size: 12px;
    }
    .mine .reply-quote { background: rgba(255,255,255,.2); border-left-color: #fff; }
    .reply-quote .rq-who { font-weight: 700; }
    .reply-quote .rq-text { opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; max-width: 320px; }

    /* подсветка при переходе к сообщению */
    @keyframes flash { 0%{ box-shadow:0 0 0 3px var(--accent);} 100%{ box-shadow:none;} }
    .row.flash .bubble { animation: flash 1.4s ease-out; }

    .file {
      display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px; margin-top: 4px;
      background: rgba(127,127,127,.16); cursor: pointer; text-decoration: none; color: inherit;
    }
    .mine .file { background: rgba(255,255,255,.2); }
    .file .icon { font-size: 22px; }
    .file .info { flex: 1; min-width: 0; }
    .file .name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file .size { font-size: 11px; opacity: .8; }
    .file .dl { font-size: 11px; opacity: .85; }

    /* кнопки действий при наведении (ответить / реакция) */
    .msgActions {
      display: none; gap: 2px; align-self: center;
    }
    .row:hover .msgActions { display: flex; }
    .actBtn {
      border: none; background: var(--panel); color: var(--text); border: 1px solid var(--border);
      width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 15px;
      box-shadow: var(--shadow);
    }
    .actBtn:hover { background: var(--icon-bg); }

    /* реакции под сообщением */
    .reactions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
    .reaction {
      background: var(--chip-bg); border: 1px solid var(--border); border-radius: 12px;
      padding: 1px 7px; font-size: 12px; cursor: pointer; display: flex; gap: 3px; align-items: center;
    }
    .reaction.mine-react { border-color: var(--accent); background: rgba(99,102,241,.18); }
    .reaction .cnt { font-size: 11px; opacity: .85; }

    /* всплывающий выбор эмодзи */
    #emojiPicker {
      position: absolute; z-index: 60; display: none;
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,.3); padding: 6px; gap: 2px;
      grid-template-columns: repeat(6, 1fr);
    }
    #emojiPicker.open { display: grid; }
    #emojiPicker button { border: none; background: none; font-size: 20px; cursor: pointer; padding: 4px; border-radius: 8px; }
    #emojiPicker button:hover { background: var(--icon-bg); }

    #scrollDown {
      display: none; position: absolute; right: 18px; bottom: 18px;
      width: 44px; height: 44px; border-radius: 50%; border: none;
      background: var(--accent); color: #fff; font-size: 20px; cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,.3); z-index: 10;
    }
    #scrollDown .badge {
      position: absolute; top: -4px; right: -4px; background: #ef4444; color: #fff;
      font-size: 11px; min-width: 18px; height: 18px; border-radius: 9px; padding: 0 4px;
      display: none; align-items: center; justify-content: center;
    }

    #typing { font-size: 12px; color: var(--muted); padding: 2px 16px 0; min-height: 16px; font-style: italic; }

    /* панель ответа над вводом */
    #replyBar {
      display: none; align-items: center; gap: 10px; padding: 8px 16px;
      background: var(--hint-bg); border-top: 1px solid var(--border);
    }
    #replyBar .rb-info { flex: 1; min-width: 0; font-size: 13px; border-left: 3px solid var(--accent); padding-left: 8px; }
    #replyBar .rb-who { font-weight: 700; color: var(--accent); }
    #replyBar .rb-text { opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #replyBar .rb-close { cursor: pointer; font-size: 20px; color: var(--muted); }

    /* прикреплённые файлы (чипы) над вводом */
    #attachBar { display: none; flex-wrap: wrap; gap: 8px; padding: 8px 16px 0; }
    .attchip {
      display: flex; align-items: center; gap: 6px; background: var(--chip-bg);
      border: 1px solid var(--border); border-radius: 10px; padding: 4px 6px 4px 8px; font-size: 12px; max-width: 200px;
    }
    .attchip img { width: 32px; height: 32px; border-radius: 6px; object-fit: cover; }
    .attchip .an { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 110px; }
    .attchip .ax { cursor: pointer; color: var(--muted); font-size: 16px; }
    .attchip.loading { opacity: .6; }

    form {
      display: flex; gap: 8px; padding: 10px; background: var(--panel);
      border-top: 1px solid var(--border); flex-shrink: 0; align-items: flex-end;
    }
    #text {
      flex: 1; padding: 11px 14px; border: 1px solid var(--input-border);
      border-radius: 22px; font-size: 15px; outline: none; resize: none;
      font-family: inherit; max-height: 120px; background: var(--input-bg); color: var(--text);
    }
    #text:focus { border-color: var(--accent); }
    .iconbtn {
      border: none; background: var(--icon-bg); color: var(--accent); border-radius: 50%;
      width: 42px; height: 42px; font-size: 20px; cursor: pointer; flex-shrink: 0;
    }
    .sendbtn { background: var(--accent); color: #fff; }
    .iconbtn:hover { filter: brightness(.95); }
    .hint { font-size: 11px; color: var(--muted); text-align: center; padding: 4px; background: var(--hint-bg); }

    #uploadBar { display: none; padding: 6px 16px; background: var(--icon-bg); color: var(--accent); font-size: 13px; align-items: center; gap: 10px; }
    #uploadBar .track { flex: 1; height: 6px; background: var(--avatar-bg); border-radius: 3px; overflow: hidden; }
    #uploadBar .fill { height: 100%; width: 0%; background: var(--accent); transition: width .2s; }

    .mention { background: rgba(79,70,229,.2); color: var(--accent); font-weight: 700; border-radius: 5px; padding: 0 3px; }
    .mine .mention { background: rgba(255,255,255,.3); color: #fff; }
    .row.mention-me .bubble { box-shadow: 0 0 0 2px var(--accent); }

    .pmtag { font-size: 10px; font-weight: 700; color: #fff; background: #9333ea; border-radius: 6px; padding: 1px 6px; margin-bottom: 3px; display: inline-block; }
    .theirs.pm .bubble { background: #f3e8ff; color: #3b0764; }
    body.dark .theirs.pm .bubble { background: #3b2a52; color: #f1f5f9; }

    /* выпадающий список автодополнения (@ и /w) */
    #mentionBox {
      position: absolute; bottom: 60px; left: 60px; z-index: 50;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.28);
      max-height: 220px; overflow-y: auto; min-width: 200px; display: none;
    }
    #mentionBox .mhdr { font-size: 11px; color: var(--muted); padding: 6px 10px 2px; }
    #mentionBox .item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; cursor: pointer; }
    #mentionBox .item.active, #mentionBox .item:hover { background: var(--icon-bg); }
    #mentionBox .item img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: var(--avatar-bg); }
    #mentionBox .item .nm { font-size: 14px; color: var(--text); }
    #mentionBox .item .st { font-size: 10px; margin-left: auto; font-weight: 700; }
    #mentionBox .item .st.on { color: #16a34a; }
    #mentionBox .item .st.off { color: #ef4444; }

    /* панель поиска */
    #searchBar {
      display: none; align-items: center; gap: 8px; padding: 8px 16px;
      background: var(--panel); border-bottom: 1px solid var(--border);
    }
    #searchBar.show { display: flex; }
    #searchInput {
      flex: 1; padding: 8px 12px; border: 1px solid var(--input-border);
      border-radius: 10px; font-size: 14px; outline: none; background: var(--input-bg); color: var(--text);
    }
    #searchInput:focus { border-color: var(--accent); }
    #searchBar .sCount { font-size: 12px; color: var(--muted); min-width: 40px; text-align: center; }
    #searchBar .sNav {
      border: 1px solid var(--border); background: var(--icon-bg); color: var(--text);
      width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 13px;
    }
    #searchBar .sNav:hover { background: var(--accent); color: #fff; }
    /* подсветка найденного */
    .search-hit mark { background: #fde047; color: #000; border-radius: 3px; padding: 0 1px; }
    .row.search-current .bubble { box-shadow: 0 0 0 3px #f59e0b; }

    /* отметка "изменено" и удалённое сообщение */
    .editedMark { font-size: 10px; opacity: .6; font-style: italic; margin-left: 4px; }

    /* редактирование сообщения на месте */
    .editArea {
      width: 100%; min-width: 220px; border: 1px solid var(--input-border); border-radius: 8px;
      padding: 6px 8px; font-size: 14px; font-family: inherit; resize: vertical; min-height: 38px;
      background: var(--input-bg); color: var(--text); outline: none;
    }
    .editBtns { display: flex; gap: 6px; margin-top: 5px; }
    .editBtns button { border: none; border-radius: 8px; padding: 4px 12px; font-size: 12px; cursor: pointer; }
    .editSave { background: var(--accent); color: #fff; }
    .editCancel { background: var(--icon-bg); color: var(--text); }

    /* оверлей перетаскивания файла */
    #dropOverlay {
      display: none; position: fixed; inset: 0; z-index: 150;
      background: rgba(79,70,229,.25); border: 4px dashed var(--accent);
      align-items: center; justify-content: center; flex-direction: column; gap: 12px;
      color: #fff; font-size: 26px; font-weight: 700; text-shadow: 0 2px 6px rgba(0,0,0,.5);
    }
    #dropOverlay.show { display: flex; }
  </style>
</head>
<body>
  <header>
    <div class="avawrap">
      <img id="myAvatar" class="ava" title="Сменить фото">
      <span class="dot online" id="myDot"></span>
    </div>
    <div class="title">
      <h1>💬 Общий чат
        <button class="memToggle" id="memToggle" title="Показать участников">👥 <span id="memCount"></span> <span id="memArrow">▸</span></button>
      </h1>
      <div class="me">{{ user }} · <a href="/logout">выйти</a></div>
    </div>
    <button class="headbtn" id="searchBtn" title="Поиск по чату">🔍</button>
    <button class="headbtn" id="soundBtn" title="Звук уведомлений">🔔</button>
    <button class="headbtn" id="themeBtn" title="Сменить тему">🌙</button>
  </header>

  <div id="searchBar">
    <input id="searchInput" placeholder="Поиск по сообщениям…" autocomplete="off">
    <span class="sCount" id="searchCount"></span>
    <button class="sNav" id="searchPrev" title="Предыдущее">▲</button>
    <button class="sNav" id="searchNext" title="Следующее">▼</button>
    <button class="sNav" id="searchClose" title="Закрыть">✕</button>
  </div>

  <div id="members" class="collapsed"></div>

  <div id="chatArea">
    <div id="messages"></div>
    <button id="scrollDown" title="Вниз">⬇<span class="badge" id="scrollBadge"></span></button>
  </div>

  <div id="emojiPicker"></div>

  <div id="typing"></div>

  <div id="lightbox">
    <span class="close" id="lightboxClose">✕</span>
    <img id="lightboxImg" src="">
    <a id="lightboxDownload" href="" download>⬇ Скачать</a>
  </div>

  <div id="uploadBar">
    <span id="uploadName">Отправка…</span>
    <div class="track"><div class="fill" id="uploadFill"></div></div>
    <span id="uploadPct">0%</span>
  </div>

  <div id="replyBar">
    <div class="rb-info"><span class="rb-who" id="rbWho"></span><div class="rb-text" id="rbText"></div></div>
    <span class="rb-close" id="rbClose">✕</span>
  </div>

  <div id="attachBar"></div>

  <div class="hint">Перетащите файл сюда · 📎 — прикрепить · @имя — упомянуть · /w имя текст — лично · наведите на сообщение для ответа/реакции</div>

  <div id="mentionBox"></div>

  <form id="form">
    <button type="button" class="iconbtn" id="fileBtn" title="Прикрепить файл">📎</button>
    <textarea id="text" rows="1" placeholder="Напишите сообщение…" autocomplete="off"></textarea>
    <button type="submit" class="iconbtn sendbtn">➤</button>
  </form>

  <input type="file" id="fileInput" multiple style="display:none">
  <input type="file" id="avatarInput" accept="image/*" style="display:none">

  <div id="dropOverlay">📎 Отпустите, чтобы прикрепить файлы</div>

  <script>
  const me = {{ user|tojson }};
  const box = document.getElementById("messages");
  const form = document.getElementById("form");
  const input = document.getElementById("text");
  let lastId = 0;
  let avatars = {};
  let presence = {};
  let usersList = [];
  const shownIds = new Set();
  const msgById = {};            // id -> {username, text, kind, ...} для цитат
  let polling = false;
  let unread = 0;
  let lastDateLabel = "";
  let replyTo = null;            // id сообщения, на которое отвечаем
  let pendingAttachments = [];   // [{fileId,name,size,isImage}] прикреплённые файлы

  const REACTION_EMOJIS = ["👍","❤️","😂","😮","😢","🔥","🎉","👎"];

  const defaultAva =
    "data:image/svg+xml," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60">' +
      '<rect width="60" height="60" fill="#c7d2fe"/>' +
      '<circle cx="30" cy="23" r="11" fill="#6366f1"/>' +
      '<rect x="12" y="38" width="36" height="22" rx="11" fill="#6366f1"/></svg>');

  function avaFor(u){ return avatars[u] || defaultAva; }
  function fmtTime(iso){ const d=new Date(iso); return d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}); }
  function fmtSize(b){ if(b<1024)return b+" Б"; if(b<1048576)return (b/1024).toFixed(1)+" КБ"; return (b/1048576).toFixed(1)+" МБ"; }
  function escapeHtml(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

  function dateLabel(iso){
    const d = new Date(iso);
    const today = new Date(); const yest = new Date(); yest.setDate(today.getDate()-1);
    const same = (a,b)=> a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
    if(same(d,today)) return "Сегодня";
    if(same(d,yest)) return "Вчера";
    return d.toLocaleDateString([], {day:"numeric", month:"long", year:"numeric"});
  }

  function linkify(text){
    let esc = escapeHtml(text);
    esc = esc.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    esc = esc.replace(/@([A-Za-z0-9_.\-а-яёА-ЯЁ]+)/g, '<span class="mention">@$1</span>');
    return esc;
  }
  function mentionsMe(text){
    const re = new RegExp("@" + me.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "i");

  }

  function beep(){
    if(!soundOn) return;
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = "sine"; o.frequency.value = 660;
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.25);
      o.start(); o.stop(ctx.currentTime + 0.26);
    }catch(e){}
  }
  function pingSound(){
    if(!soundOn) return;
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [880, 1175].forEach((fr, i)=>{
        const o = ctx.createOscillator(); const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = "sine"; o.frequency.value = fr;
        const t = ctx.currentTime + i*0.18;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.16, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
        o.start(t); o.stop(t + 0.17);
      });
    }catch(e){}
  }

  // ===================================================== редактирование / удаление
  function startEdit(mid, bubble){
    const m = msgById[mid]; if(!m) return;
    const txtEl = bubble.querySelector(".txt");
    if(!txtEl || bubble.querySelector(".editArea")) return;
    txtEl.style.display = "none";

    const ta = document.createElement("textarea");
    ta.className = "editArea"; ta.value = m.text;
    const btns = document.createElement("div");
    btns.className = "editBtns";
    btns.innerHTML = `<button class="editSave">Сохранить</button><button class="editCancel">Отмена</button>`;
    bubble.insertBefore(ta, txtEl.nextSibling);
    bubble.insertBefore(btns, ta.nextSibling);
    ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);

    function cleanup(){ ta.remove(); btns.remove(); txtEl.style.display = ""; }
    btns.querySelector(".editCancel").onclick = cleanup;
    btns.querySelector(".editSave").onclick = ()=> saveEdit(mid, ta.value, cleanup);
    ta.addEventListener("keydown", (e)=>{
      if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); saveEdit(mid, ta.value, cleanup); }
      if(e.key === "Escape"){ cleanup(); }
    });
  }

  async function saveEdit(mid, newText, cleanup){
    newText = newText.trim();
    if(!newText){ showToast("Текст не может быть пустым"); return; }
    if(newText === msgById[mid].text){ cleanup(); return; }
    try{
      const r = await fetch("/api/edit", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ id: mid, text: newText })});
      if(!r.ok){ const e = await r.json().catch(()=>({})); showToast(e.error || "Не удалось изменить"); return; }
      // локально обновим сразу
      msgById[mid].text = newText; msgById[mid].edited = 1;
      applyEdit(mid, newText, true);
      cleanup();
    }catch(e){ showToast("Ошибка сети"); }
  }

  // синхронизация правок/удалений ранее показанных сообщений
  async function syncChanges(){
    const ids = Object.keys(msgById);
    if(!ids.length) return;
    try{
      const r = await fetch("/api/changes?ids=" + ids.join(","));
      if(!r.ok) return;
      const res = await r.json();
      // удалённые — убираем из чата
      (res.missing || []).forEach(id=> removeMessage(id));
      // изменённые — обновляем текст
      (res.items || []).forEach(ch=>{
        const local = msgById[ch.id];
        if(!local) return;
        if(ch.text !== local.text || ch.edited !== local.edited){
          local.text = ch.text; local.edited = ch.edited;
          applyEdit(ch.id, ch.text, !!ch.edited);
        }
      });
    }catch(e){}
  }

  function nearBottom(){ return box.scrollHeight - box.scrollTop - box.clientHeight < 120; }

  async function pollMessages(){
    if(polling) return;
    polling = true;
    try{
      const res = await fetch("/api/messages?after=" + lastId);
      if(res.status === 401){ location.href="/login"; return; }
      const data = await res.json();
      const wasNear = nearBottom();
      let addedOther = 0, addedMine = 0, pinged = false;
      data.forEach(m => {
        if(!shownIds.has(m.id)){
          addMessage(m);
          if(m.username === me){ addedMine++; }
          else {
            addedOther++;
            if(m.recipient === me || (!m.recipient && mentionsMe(m.text))) pinged = true;
          }
        }
      });
      if(addedMine || (addedOther && wasNear)) box.scrollTop = box.scrollHeight;
      if(addedOther){
        const active = document.visibilityState === "visible" && wasNear;
        if(!active){ unread += addedOther; updateTitle(); showScrollBadge(); }
        if(pinged){ pingSound(); notifyDesktop(); } else { beep(); }
      }
      if(addedOther || addedMine){ loadReactions(); }
      if(nearBottom() && document.visibilityState === "visible"){ unread = 0; updateTitle(); reportRead(); }
    }catch(e){}
    finally{ polling = false; }
  }

  function showScrollBadge(){ if(unread > 0){ scrollBadge.style.display = "flex"; scrollBadge.textContent = unread; } }
  scrollDown.onclick = ()=>{ box.scrollTop = box.scrollHeight; unread = 0; updateTitle(); scrollBadge.style.display="none"; reportRead(); };
  box.addEventListener("scroll", ()=>{
    scrollDown.style.display = nearBottom() ? "none" : "block";
    if(nearBottom()){ unread = 0; updateTitle(); scrollBadge.style.display="none"; if(document.visibilityState==="visible") reportRead(); }
  });

  // ===================================================== автодополнение @ и /w
  const mentionBox = document.getElementById("mentionBox");
  let mentionItems = [];
  let mentionActive = -1;
  let mentionStart = -1;
  let mentionMode = "";       // "at" или "w"

  function closeMention(){ mentionBox.style.display = "none"; mentionItems = []; mentionActive = -1; mentionStart = -1; mentionMode=""; }

  function updateMention(){
    const pos = input.selectionStart;
    const before = input.value.slice(0, pos);
    // вариант 1: @слово рядом с курсором
    let m = before.match(/(^|\s)@([A-Za-z0-9_.\-а-яёА-ЯЁ]*)$/);
    if(m){
      mentionMode = "at";
      mentionStart = pos - m[2].length - 1;
      showCandidates(m[2].toLowerCase());
      return;
    }
    // вариант 2: команда "/w слово" в самом начале
    m = before.match(/^\/w\s+([A-Za-z0-9_.\-а-яёА-ЯЁ]*)$/);
    if(m){
      mentionMode = "w";
      mentionStart = pos - m[1].length;
      showCandidates(m[1].toLowerCase());
      return;
    }
    closeMention();
  }

  function showCandidates(q){
    const cands = usersList.filter(u => u.username !== me && u.username.toLowerCase().startsWith(q)).slice(0, 6);
    if(cands.length === 0){ closeMention(); return; }
    mentionItems = cands; mentionActive = 0;
    renderMention();
  }

  function renderMention(){
    mentionBox.innerHTML = "";
    const hdr = document.createElement("div");
    hdr.className = "mhdr";
    hdr.textContent = mentionMode === "w" ? "Кому отправить личное сообщение:" : "Упомянуть пользователя:";
    mentionBox.appendChild(hdr);
    mentionItems.forEach((u, i)=>{
      const it = document.createElement("div");
      it.className = "item" + (i === mentionActive ? " active" : "");
      it.innerHTML = `<img><span class="nm"></span><span class="st ${u.online?"on":"off"}">${u.online?"● в сети":"○ не в сети"}</span>`;
      it.querySelector("img").src = avaFor(u.username);
      it.querySelector(".nm").textContent = u.username;
      it.onmousedown = (e)=>{ e.preventDefault(); pickMention(i); };
      mentionBox.appendChild(it);
    });
    mentionBox.style.display = "block";
  }

  function pickMention(i){
    const u = mentionItems[i]; if(!u) return;
    const pos = input.selectionStart;
    const after = input.value.slice(pos);
    const before = input.value.slice(0, mentionStart);
    if(mentionMode === "w"){
      input.value = before + u.username + " " + after;
      const np = (before + u.username + " ").length;
      input.setSelectionRange(np, np);
    } else {
      input.value = before + "@" + u.username + " " + after;
      const np = (before + "@" + u.username + " ").length;
      input.setSelectionRange(np, np);
    }
    closeMention(); input.focus(); autoGrow();
  }

  // ===================================================== ввод
  function autoGrow(){ input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 120) + "px"; }
  input.addEventListener("input", ()=>{ autoGrow(); notifyTyping(); updateMention(); });
  input.addEventListener("keydown", (e)=>{
    if(mentionBox.style.display === "block" && mentionItems.length){
      if(e.key === "ArrowDown"){ e.preventDefault(); mentionActive = (mentionActive+1)%mentionItems.length; renderMention(); return; }
      if(e.key === "ArrowUp"){ e.preventDefault(); mentionActive = (mentionActive-1+mentionItems.length)%mentionItems.length; renderMention(); return; }
      if(e.key === "Enter" || e.key === "Tab"){ e.preventDefault(); pickMention(mentionActive); return; }
      if(e.key === "Escape"){ closeMention(); return; }
    }
    if(e.key === "Escape" && replyTo){ cancelReply(); return; }
    if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); form.requestSubmit(); }
  });
  input.addEventListener("blur", ()=> setTimeout(closeMention, 150));

  form.addEventListener("submit", async (e)=>{
    e.preventDefault();
    const text = input.value.trim();
    if(!text && pendingAttachments.length === 0) return;
    closeMention();
    const payload = { text, reply_to: replyTo, attachments: pendingAttachments.map(a=>a.fileId) };
    input.value = ""; autoGrow();
    const savedReply = replyTo, savedAtt = pendingAttachments.slice();
    cancelReply(); clearAttachments();
    try{
      const r = await fetch("/api/send",{method:"POST",headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload)});
      if(!r.ok){
        const err = await r.json().catch(()=>({}));
        input.value = text; autoGrow();
        replyTo = savedReply; pendingAttachments = savedAtt; renderAttachments();
        if(savedReply) setReply(savedReply);
        showToast(err.error || "Не удалось отправить");
        return;
      }
    }catch(e){ input.value = text; autoGrow(); showToast("Ошибка сети"); return; }
    pollMessages();
  });

  function showToast(msg){
    let t = document.getElementById("toast");
    if(!t){
      t = document.createElement("div"); t.id = "toast";
      t.style.cssText = "position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#ef4444;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:200;box-shadow:0 2px 10px rgba(0,0,0,.3)";
      document.body.appendChild(t);
    }
    t.textContent = msg; t.style.display = "block";
    clearTimeout(t._tm); t._tm = setTimeout(()=> t.style.display = "none", 3500);
  }

  // ===================================================== прикрепление файлов
  const MAX_BYTES = {{ max_mb }} * 1024 * 1024;
  const uploadBar = document.getElementById("uploadBar");
  const uploadFill = document.getElementById("uploadFill");
  const uploadPct = document.getElementById("uploadPct");
  const uploadName = document.getElementById("uploadName");
  const attachBar = document.getElementById("attachBar");

  document.getElementById("fileBtn").onclick = ()=> document.getElementById("fileInput").click();
  document.getElementById("fileInput").onchange = (e)=>{
    const files = Array.from(e.target.files || []);
    e.target.value = "";
    files.forEach(addAttachment);
  };

  function clearAttachments(){ pendingAttachments = []; renderAttachments(); }
  function renderAttachments(){
    attachBar.innerHTML = "";
    if(pendingAttachments.length === 0){ attachBar.style.display = "none"; return; }
    attachBar.style.display = "flex";
    pendingAttachments.forEach((a, idx)=>{
      const chip = document.createElement("div");
      chip.className = "attchip" + (a.loading ? " loading" : "");
      if(a.isImage && a.fileId){
        chip.innerHTML = `<img src="/api/image/${a.fileId}"><span class="an"></span><span class="ax">✕</span>`;
      } else {
        chip.innerHTML = `<span>📄</span><span class="an"></span><span class="ax">✕</span>`;
      }
      chip.querySelector(".an").textContent = a.loading ? (a.name + " …") : a.name;
      chip.querySelector(".ax").onclick = ()=>{ pendingAttachments.splice(idx,1); renderAttachments(); };
      attachBar.appendChild(chip);
    });
  }

  function addAttachment(f){
    if(f.size > MAX_BYTES){ showToast("Файл слишком большой. Максимум {{ max_mb }} МБ: " + f.name); return; }
    // временный объект, пока грузится
    const temp = { name: f.name, size: f.size, isImage: (f.type||"").startsWith("image/"), loading: true };
    pendingAttachments.push(temp);
    renderAttachments();

    uploadBar.style.display = "flex";
    uploadName.textContent = "Загрузка: " + f.name;
    uploadFill.style.width = "0%"; uploadPct.textContent = "0%";
    const fd = new FormData(); fd.append("file", f);
    const xhr = new XMLHttpRequest();
    xhr.open("POST", "/api/upload");
    xhr.upload.onprogress = (ev)=>{
      if(ev.lengthComputable){ const p = Math.round(ev.loaded/ev.total*100); uploadFill.style.width = p+"%"; uploadPct.textContent = p+"%"; }
    };
    xhr.onload = ()=>{
      uploadBar.style.display = "none";
      if(xhr.status === 200){
        try{
          const res = JSON.parse(xhr.responseText);
          temp.fileId = res.fileId; temp.name = res.name; temp.size = res.size; temp.isImage = res.isImage; temp.loading = false;
          renderAttachments();
        }catch(e){ removeTemp(temp); showToast("Ошибка загрузки"); }
      } else if(xhr.status === 413){ removeTemp(temp); showToast("Файл слишком большой"); }
      else { removeTemp(temp); showToast("Не удалось загрузить файл"); }
    };
    xhr.onerror = ()=>{ uploadBar.style.display = "none"; removeTemp(temp); showToast("Ошибка сети при загрузке"); };
    xhr.send(fd);
  }
  function removeTemp(temp){ const i = pendingAttachments.indexOf(temp); if(i>=0) pendingAttachments.splice(i,1); renderAttachments(); }

  // вставка картинки из буфера (Ctrl+V) -> как вложение
  document.addEventListener("paste", (e)=>{
    const items = (e.clipboardData || {}).items || [];
    for(const it of items){
      if(it.type && it.type.startsWith("image/")){
        const f = it.getAsFile();
        if(f){ addAttachment(f); e.preventDefault(); return; }
      }
    }
  });

  // ===================================================== перетаскивание файлов
  const dropOverlay = document.getElementById("dropOverlay");
  let dragDepth = 0;
  window.addEventListener("dragenter", (e)=>{
    if(e.dataTransfer && Array.from(e.dataTransfer.types||[]).includes("Files")){
      e.preventDefault(); dragDepth++; dropOverlay.classList.add("show");
    }
  });
  window.addEventListener("dragover", (e)=>{ if(dropOverlay.classList.contains("show")) e.preventDefault(); });
  window.addEventListener("dragleave", (e)=>{ dragDepth--; if(dragDepth <= 0){ dragDepth = 0; dropOverlay.classList.remove("show"); } });
  window.addEventListener("drop", (e)=>{
    if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length){
      e.preventDefault();
      Array.from(e.dataTransfer.files).forEach(addAttachment);
    }
    dragDepth = 0; dropOverlay.classList.remove("show");
  });

  document.addEventListener("visibilitychange", ()=>{
    if(document.visibilityState === "visible"){ unread = 0; updateTitle(); scrollBadge.style.display="none"; reportRead(); }
  });
  window.addEventListener("focus", ()=>{ unread = 0; updateTitle(); reportRead(); });

  // ===================================================== поиск по чату
  const searchBar = document.getElementById("searchBar");
  const searchInput = document.getElementById("searchInput");
  const searchCount = document.getElementById("searchCount");
  let searchHits = [];      // массив row-элементов с совпадениями
  let searchIdx = -1;

  function clearSearchHighlights(){
    document.querySelectorAll(".row.search-hit").forEach(row=>{
      row.classList.remove("search-hit", "search-current");
      const t = row.querySelector(".txt");
      if(t && t.getAttribute("data-text-id")){
        const m = msgById[t.getAttribute("data-text-id")];
        if(m){ t.innerHTML = linkify(m.text); if(m.edited){ const em=document.createElement("span"); em.className="editedMark"; em.textContent="(изменено)"; t.appendChild(document.createTextNode(" ")); t.appendChild(em);} }
      }
    });
  }

  function runSearch(){
    clearSearchHighlights();
    searchHits = []; searchIdx = -1;
    const q = searchInput.value.trim().toLowerCase();
    if(!q){ searchCount.textContent = ""; return; }
    document.querySelectorAll(".row[data-msg-id]").forEach(row=>{
      const mid = row.getAttribute("data-msg-id");
      const m = msgById[mid];
      if(!m || !m.text) return;
      if(m.text.toLowerCase().includes(q)){
        row.classList.add("search-hit");
        const t = row.querySelector(".txt");
        if(t){
          // подсветка вхождений (по тексту, безопасно)
          const esc = escapeHtml(m.text);
          const re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
          let html = esc.replace(re, "<mark>$1</mark>");
          html = html.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
          html = html.replace(/@([A-Za-z0-9_.\-а-яёА-ЯЁ]+)/g, '<span class="mention">@$1</span>');
          t.innerHTML = html;
          if(m.edited){ const em=document.createElement("span"); em.className="editedMark"; em.textContent="(изменено)"; t.appendChild(document.createTextNode(" ")); t.appendChild(em); }
        }
        searchHits.push(row);
      }
    });
    if(searchHits.length){ searchIdx = searchHits.length - 1; focusHit(); }
    updateSearchCount();
  }

  function updateSearchCount(){
    searchCount.textContent = searchHits.length ? (searchIdx+1) + "/" + searchHits.length : "0";
  }
  function focusHit(){
    searchHits.forEach(r=> r.classList.remove("search-current"));
    const row = searchHits[searchIdx];
    if(row){ row.classList.add("search-current"); row.scrollIntoView({behavior:"smooth", block:"center"}); }
    updateSearchCount();
  }
  function nextHit(d){
    if(!searchHits.length) return;
    searchIdx = (searchIdx + d + searchHits.length) % searchHits.length;
    focusHit();
  }
  function openSearch(){ searchBar.classList.add("show"); searchInput.focus(); searchInput.select(); }
  function closeSearch(){ searchBar.classList.remove("show"); clearSearchHighlights(); searchHits=[]; searchIdx=-1; searchInput.value=""; searchCount.textContent=""; }

  document.getElementById("searchBtn").onclick = ()=> searchBar.classList.contains("show") ? closeSearch() : openSearch();
  document.getElementById("searchClose").onclick = closeSearch;
  document.getElementById("searchPrev").onclick = ()=> nextHit(-1);
  document.getElementById("searchNext").onclick = ()=> nextHit(1);
  let searchTm = 0;
  searchInput.addEventListener("input", ()=>{ clearTimeout(searchTm); searchTm = setTimeout(runSearch, 200); });
  searchInput.addEventListener("keydown", (e)=>{
    if(e.key === "Enter"){ e.preventDefault(); nextHit(e.shiftKey ? -1 : 1); }
    if(e.key === "Escape"){ closeSearch(); }
  });
  // Ctrl/Cmd+F открывает поиск
  document.addEventListener("keydown", (e)=>{
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "f"){ e.preventDefault(); openSearch(); }
  });

  // ===================================================== старт
  heartbeat();
  loadAvatars();
  loadPresence();
  pollMessages();
  loadReactions();
  setInterval(pollMessages, 2000);
  setInterval(heartbeat, 10000);
  setInterval(loadPresence, 6000);
  setInterval(loadReads, 4000);
  setInterval(reportRead, 5000);
  setInterval(loadTyping, 2000);
  setInterval(loadReactions, 4000);
  setInterval(syncChanges, 4000);
  </script>
</body>
</html>
