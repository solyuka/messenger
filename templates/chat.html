<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чат</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f1f5f9; display: flex; flex-direction: column;
    }
    header {
      background: #6366f1; color: #fff; padding: 10px 16px;
      display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    }
    /* обёртка аватарки с индикатором онлайн */
    .avawrap { position: relative; flex-shrink: 0; }
    .avawrap .dot {
      position: absolute; bottom: 0; right: 0;
      width: 14px; height: 14px; border-radius: 50%;
      background: #ef4444; border: 2px solid #fff;
    }
    .avawrap .dot.online { background: #22c55e; }

    header .avawrap .ava {
      width: 64px; height: 64px; border-radius: 50%; object-fit: cover;
      background: #c7d2fe; cursor: pointer; border: 2px solid #fff;
    }
    header .avawrap .dot { width: 16px; height: 16px; }
    header .title { flex: 1; }
    header h1 { font-size: 16px; margin: 0; }
    header .me { font-size: 12px; opacity: .85; }
    header a { color: #e0e7ff; font-size: 13px; text-decoration: none; }

    /* панель участников */
    #members {
      display: flex; gap: 16px; padding: 10px 16px; background: #fff;
      border-bottom: 1px solid #e2e8f0; overflow-x: auto; flex-shrink: 0;
    }
    #members .member { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 56px; }
    #members .avawrap .ava {
      width: 46px; height: 46px; border-radius: 50%; object-fit: cover; background: #c7d2fe;
    }
    #members .mname { font-size: 11px; color: #475569; max-width: 60px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #members .mstat { font-size: 10px; }
    #members .mstat.on { color: #22c55e; }
    #members .mstat.off { color: #ef4444; }

    #messages {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 10px;
    }

    /* превью картинки в сообщении */
    .imgprev {
      display: block; margin-top: 4px; max-width: 240px; max-height: 240px;
      border-radius: 10px; cursor: pointer; object-fit: cover;
    }
    .imgcap { font-size: 11px; opacity: .7; margin-top: 2px; }

    /* полноэкранный просмотр картинки */
    #lightbox {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
      z-index: 100; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
    }
    #lightbox img { max-width: 92%; max-height: 80%; border-radius: 8px; }
    #lightbox a {
      color: #fff; background: #6366f1; padding: 10px 20px; border-radius: 10px;
      text-decoration: none; font-size: 15px;
    }
    #lightbox .close { position: absolute; top: 16px; right: 20px; color: #fff; font-size: 32px; cursor: pointer; }
    .row { display: flex; gap: 8px; align-items: flex-end; max-width: 80%; }
    .row.mine { align-self: flex-end; flex-direction: row-reverse; }
    .row .avawrap .ava {
      width: 52px; height: 52px; border-radius: 50%; object-fit: cover;
      background: #c7d2fe;
    }
    .bubble { padding: 8px 12px; border-radius: 14px; line-height: 1.35; }
    .bubble .who { font-size: 12px; font-weight: 600; margin-bottom: 2px; opacity: .8; }
    .bubble .txt { white-space: pre-wrap; word-wrap: break-word; }
    .bubble .time { font-size: 10px; opacity: .6; margin-top: 3px; text-align: right; }
    .bubble .reads { font-size: 10px; opacity: .85; margin-top: 2px; text-align: right; }
    .mine .bubble { background: #6366f1; color: #fff; }
    .mine .bubble .who { display: none; }
    .theirs .bubble { background: #fff; color: #1e293b; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
    .theirs .bubble .reads { display: none; }

    .file {
      display: flex; align-items: center; gap: 10px;
      padding: 8px; border-radius: 10px; margin-top: 2px;
      background: rgba(0,0,0,.06); cursor: pointer; text-decoration: none; color: inherit;
    }
    .mine .file { background: rgba(255,255,255,.18); }
    .file .icon { font-size: 22px; }
    .file .info { flex: 1; min-width: 0; }
    .file .name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file .size { font-size: 11px; opacity: .7; }
    .file .dl { font-size: 11px; opacity: .8; }

    form {
      display: flex; gap: 8px; padding: 10px; background: #fff;
      border-top: 1px solid #e2e8f0; flex-shrink: 0; align-items: center;
    }
    #text {
      flex: 1; padding: 11px 14px; border: 1px solid #cbd5e1;
      border-radius: 22px; font-size: 15px; outline: none;
    }
    #text:focus { border-color: #6366f1; }
    .iconbtn {
      border: none; background: #eef2ff; color: #6366f1; border-radius: 50%;
      width: 42px; height: 42px; font-size: 20px; cursor: pointer; flex-shrink: 0;
    }
    .sendbtn { background: #6366f1; color: #fff; }
    .iconbtn:hover { filter: brightness(.95); }
    .hint {
      font-size: 11px; color: #94a3b8; text-align: center; padding: 4px;
      background: #f8fafc;
    }
    #uploadBar {
      display: none; padding: 6px 16px; background: #eef2ff; color: #4f46e5;
      font-size: 13px; align-items: center; gap: 10px;
    }
    #uploadBar .track { flex: 1; height: 6px; background: #c7d2fe; border-radius: 3px; overflow: hidden; }
    #uploadBar .fill { height: 100%; width: 0%; background: #6366f1; transition: width .2s; }
  </style>
</head>
<body>
  <header>
    <div class="avawrap">
      <img id="myAvatar" class="ava" title="Сменить фото">
      <span class="dot online" id="myDot"></span>
    </div>
    <div class="title">
      <h1>💬 Общий чат</h1>
      <div class="me">{{ user }} · <a href="/logout">выйти</a></div>
    </div>
  </header>

  <div id="members"></div>

  <div id="messages"></div>

  <div id="lightbox">
    <span class="close" id="lightboxClose">✕</span>
    <img id="lightboxImg" src="">
    <a id="lightboxDownload" href="" download>⬇ Скачать</a>
  </div>

  <div id="uploadBar">
    <span id="uploadName">Отправка…</span>
    <div class="track"><div class="fill" id="uploadFill"></div></div>
    <span id="uploadPct">0%</span>
  </div>

  <div class="hint">Файлы (до {{ max_mb }} МБ) хранятся 24 часа, затем удаляются автоматически.</div>

  <form id="form">
    <button type="button" class="iconbtn" id="fileBtn" title="Прикрепить файл">📎</button>
    <input id="text" placeholder="Напишите сообщение…" autocomplete="off">
    <button type="submit" class="iconbtn sendbtn">➤</button>
  </form>

  <input type="file" id="fileInput" style="display:none">
  <input type="file" id="avatarInput" accept="image/*" style="display:none">

  <script>
  const me = {{ user|tojson }};
  const box = document.getElementById("messages");
  const form = document.getElementById("form");
  const input = document.getElementById("text");
  let lastId = 0;
  let avatars = {};
  let presence = {};            // username -> true/false (онлайн)
  const shownIds = new Set();   // id уже показанных сообщений (защита от дублей)
  let polling = false;          // флаг: запрос за сообщениями уже выполняется
  let maxMineId = 0;            // id моего последнего сообщения (для отметок прочтения)

  const defaultAva =
    "data:image/svg+xml," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60">' +
      '<rect width="60" height="60" fill="#c7d2fe"/>' +
      '<circle cx="30" cy="23" r="11" fill="#6366f1"/>' +
      '<rect x="12" y="38" width="36" height="22" rx="11" fill="#6366f1"/></svg>');

  function avaFor(u){ return avatars[u] || defaultAva; }
  function fmtTime(iso){ const d=new Date(iso); return d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}); }
  function fmtSize(b){ if(b<1024)return b+" Б"; if(b<1048576)return (b/1024).toFixed(1)+" КБ"; return (b/1048576).toFixed(1)+" МБ"; }

  // --------------------------------------------------------------- аватарки
  document.getElementById("myAvatar").onclick = () => document.getElementById("avatarInput").click();
  document.getElementById("avatarInput").onchange = (e) => {
    const f = e.target.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = async () => {
        const c = document.createElement("canvas");
        const size = 200; c.width = size; c.height = size;
        const ctx = c.getContext("2d");
        const s = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, size, size);
        const dataUrl = c.toDataURL("image/jpeg", 0.8);
        await fetch("/api/avatar", {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({ avatar: dataUrl })
        });
        avatars[me] = dataUrl;
        document.getElementById("myAvatar").src = dataUrl;
        rerenderAvatars();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(f);
  };

  async function loadAvatars(){
    try{
      const r = await fetch("/api/avatars");
      if(r.ok){ avatars = await r.json(); document.getElementById("myAvatar").src = avaFor(me); rerenderAvatars(); }
    }catch(e){}
  }
  function rerenderAvatars(){
    document.querySelectorAll("[data-ava-user]").forEach(el=>{
      el.src = avaFor(el.getAttribute("data-ava-user"));
    });
  }

  // --------------------------------------------------------------- онлайн-статус
  async function loadPresence(){
    try{
      const r = await fetch("/api/users");   // участники + статусы + аватарки
      if(!r.ok) return;
      const users = await r.json();
      presence = {};
      users.forEach(u => { presence[u.username] = u.online; if(u.avatar) avatars[u.username] = u.avatar; });
      presence[me] = true;   // я всегда онлайн для себя

      // мой кружок всегда зелёный
      document.getElementById("myDot").className = "dot online";
      // точки у сообщений
      document.querySelectorAll("[data-dot-user]").forEach(el=>{
        const u = el.getAttribute("data-dot-user");
        el.className = "dot" + (presence[u] ? " online" : "");
      });
      renderMembers(users);
      rerenderAvatars();
    }catch(e){}
  }

  // --------------------------------------------------------------- панель участников
  function renderMembers(users){
    const cont = document.getElementById("members");
    cont.innerHTML = "";
    // сначала онлайн, потом оффлайн
    users.sort((a,b)=> (b.online?1:0)-(a.online?1:0) || a.username.localeCompare(b.username));
    users.forEach(u=>{
      const online = u.username === me ? true : u.online;
      const m = document.createElement("div");
      m.className = "member";
      m.innerHTML = `
        <div class="avawrap">
          <img class="ava">
          <span class="dot ${online ? "online" : ""}"></span>
        </div>
        <div class="mname"></div>
        <div class="mstat ${online ? "on" : "off"}">${online ? "в сети" : "не в сети"}</div>`;
      m.querySelector(".ava").src = avaFor(u.username);
      m.querySelector(".mname").textContent = u.username === me ? (u.username + " (вы)") : u.username;
      cont.appendChild(m);
    });
  }

  // --------------------------------------------------------------- просмотр картинки
  function openLightbox(viewUrl, downloadUrl, name){
    document.getElementById("lightboxImg").src = viewUrl;
    const dl = document.getElementById("lightboxDownload");
    dl.href = downloadUrl; dl.setAttribute("download", name);
    document.getElementById("lightbox").style.display = "flex";
  }
  document.getElementById("lightboxClose").onclick = ()=> document.getElementById("lightbox").style.display = "none";
  document.getElementById("lightbox").onclick = (e)=>{
    if(e.target.id === "lightbox") e.target.style.display = "none";
  };

  // --------------------------------------------------------------- пульс присутствия
  async function heartbeat(){
    try{ await fetch("/api/heartbeat", {method:"POST"}); }catch(e){}
  }

  // --------------------------------------------------------------- кто прочитал
  async function loadReads(){
    try{
      const r = await fetch("/api/reads");
      if(!r.ok) return;
      const reads = await r.json();   // username -> last_read_id
      document.querySelectorAll("[data-reads-id]").forEach(el=>{
        const mid = parseInt(el.getAttribute("data-reads-id"));
        // кто прочитал это сообщение (кроме меня)
        const who = Object.keys(reads).filter(u => u !== me && reads[u] >= mid);
        el.textContent = who.length ? ("✓✓ прочитали: " + who.join(", ")) : "";
      });
    }catch(e){}
  }

  // отметить, что я прочитал всё до lastId
  let lastReportedRead = 0;
  async function reportRead(){
    if(lastId > lastReportedRead){
      lastReportedRead = lastId;
      try{
        await fetch("/api/read", {method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({ last_id: lastId })});
      }catch(e){}
    }
  }

  // --------------------------------------------------------------- сообщения
  function addMessage(m){
    if(shownIds.has(m.id)) return;   // уже показано — пропускаем
    shownIds.add(m.id);
    const mine = m.username === me;
    const row = document.createElement("div");
    row.className = "row " + (mine ? "mine" : "theirs");

    // аватарка с индикатором онлайн
    const avawrap = document.createElement("div");
    avawrap.className = "avawrap";
    const ava = document.createElement("img");
    ava.className = "ava"; ava.setAttribute("data-ava-user", m.username);
    ava.src = avaFor(m.username);
    const dot = document.createElement("span");
    dot.className = "dot"; dot.setAttribute("data-dot-user", m.username);
    avawrap.appendChild(ava); avawrap.appendChild(dot);

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if(mine){ maxMineId = Math.max(maxMineId, m.id); }

    if(m.kind === "file"){
      let meta; try{ meta = JSON.parse(m.text); }catch(e){ meta = null; }
      bubble.innerHTML = `<div class="who"></div>`;
      bubble.querySelector(".who").textContent = m.username;
      if(meta && meta.isImage){
        // превью картинки прямо в чате
        const img = document.createElement("img");
        img.className = "imgprev";
        img.src = "/api/image/" + meta.fileId;
        img.alt = meta.name;
        img.onclick = ()=> openLightbox("/api/image/" + meta.fileId, "/api/file/" + meta.fileId, meta.name);
        bubble.appendChild(img);
        const cap = document.createElement("div");
        cap.className = "imgcap";
        cap.textContent = meta.name + " · " + fmtSize(meta.size);
        bubble.appendChild(cap);
      } else if(meta){
        const a = document.createElement("a");
        a.className = "file";
        a.href = "/api/file/" + meta.fileId;
        a.setAttribute("download", meta.name);
        a.innerHTML = `
          <div class="icon">📄</div>
          <div class="info">
            <div class="name"></div>
            <div class="size"></div>
            <div class="dl">⬇ Скачать</div>
          </div>`;
        a.querySelector(".name").textContent = meta.name;
        a.querySelector(".size").textContent = fmtSize(meta.size);
        bubble.appendChild(a);
      } else {
        const d = document.createElement("div"); d.textContent = "файл"; bubble.appendChild(d);
      }
      const reads = document.createElement("div");
      reads.className = "reads"; reads.setAttribute("data-reads-id", m.id);
      bubble.appendChild(reads);
    } else {
      bubble.innerHTML = `<div class="who"></div><div class="txt"></div><div class="time">${fmtTime(m.created)}</div><div class="reads" data-reads-id="${m.id}"></div>`;
      bubble.querySelector(".who").textContent = m.username;
      bubble.querySelector(".txt").textContent = m.text;
    }

    row.appendChild(avawrap); row.appendChild(bubble);
    box.appendChild(row);
    lastId = Math.max(lastId, m.id);
  }

  async function pollMessages(){
    if(polling) return;            // не запускаем второй запрос, пока идёт первый
    polling = true;
    try{
      const res = await fetch("/api/messages?after=" + lastId);
      if(res.status === 401){ location.href="/login"; return; }
      const data = await res.json();
      const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
      let added = false;
      data.forEach(m => {
        if(!shownIds.has(m.id)){ addMessage(m); added = true; }
      });
      if(added && nearBottom) box.scrollTop = box.scrollHeight;
      if(added && document.visibilityState === "visible"){ reportRead(); }
    }catch(e){}
    finally{ polling = false; }
  }

  form.addEventListener("submit", async (e)=>{
    e.preventDefault();
    const text = input.value.trim(); if(!text) return;
    input.value = "";
    await fetch("/api/send",{method:"POST",headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ text })});
    pollMessages();
  });

  // --------------------------------------------------------------- загрузка файла
  const MAX_BYTES = {{ max_mb }} * 1024 * 1024;
  const uploadBar = document.getElementById("uploadBar");
  const uploadFill = document.getElementById("uploadFill");
  const uploadPct = document.getElementById("uploadPct");
  const uploadName = document.getElementById("uploadName");

  document.getElementById("fileBtn").onclick = ()=> document.getElementById("fileInput").click();
  document.getElementById("fileInput").onchange = (e)=>{
    const f = e.target.files[0]; if(!f) return;
    e.target.value = "";
    if(f.size > MAX_BYTES){
      alert("Файл слишком большой. Максимум {{ max_mb }} МБ.");
      return;
    }
    uploadFile(f);
  };

  function uploadFile(f){
    uploadBar.style.display = "flex";
    uploadName.textContent = "Отправка: " + f.name;
    uploadFill.style.width = "0%"; uploadPct.textContent = "0%";

    const fd = new FormData();
    fd.append("file", f);
    const xhr = new XMLHttpRequest();
    xhr.open("POST", "/api/upload");
    xhr.upload.onprogress = (ev)=>{
      if(ev.lengthComputable){
        const p = Math.round(ev.loaded / ev.total * 100);
        uploadFill.style.width = p + "%"; uploadPct.textContent = p + "%";
      }
    };
    xhr.onload = ()=>{
      uploadBar.style.display = "none";
      if(xhr.status === 200){ pollMessages(); }
      else if(xhr.status === 413){ alert("Файл слишком большой. Максимум {{ max_mb }} МБ."); }
      else { alert("Не удалось отправить файл."); }
    };
    xhr.onerror = ()=>{ uploadBar.style.display = "none"; alert("Ошибка сети при отправке файла."); };
    xhr.send(fd);
  }

  // когда пользователь вернулся на вкладку — отмечаем прочтение
  document.addEventListener("visibilitychange", ()=>{
    if(document.visibilityState === "visible") reportRead();
  });
  window.addEventListener("focus", reportRead);

  // --------------------------------------------------------------- старт
  heartbeat();
  loadAvatars();
  loadPresence();
  pollMessages();
  setInterval(pollMessages, 2000);
  setInterval(heartbeat, 10000);     // пульс "я онлайн" каждые 10 сек
  setInterval(loadPresence, 6000);   // онлайн-статус + участники каждые 6 сек
  setInterval(loadReads, 4000);      // отметки прочтения каждые 4 сек
  setInterval(reportRead, 5000);     // периодически подтверждаем прочтение
  </script>
</body>
</html>
